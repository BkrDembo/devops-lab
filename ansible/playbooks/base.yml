---
- name: Configuration de base des serveurs
  hosts: all
  become: true

  tasks:
    - name: Mettre à jour le cache apt
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Installer les paquets de base
      ansible.builtin.apt:
        name:
          - curl
          - git
          - htop
          - vim
          - ca-certificates
        state: present
